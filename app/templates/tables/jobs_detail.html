{% extends "base.html" %}

{% block content %}
    <h1 class="text-center">Job: {{ job.process_name }}</h1>
    <div class="d-flex justify-content-center gap-3 mb-3 text-muted">
        <span><strong>Scheduler:</strong> {{ job.scheduler_name }}</span>
        <span><strong>Status:</strong> {{ job.status }}</span>
        <span><strong>Start:</strong> {{ job.start_time }}</span>
        <span><strong>End:</strong> {{ job.end_time or '-' }}</span>
    </div>

    <table id="job-logs-table"
        class="table table-striped table-hover"
        data-job-id="{{ job_id }}"
        data-toggle="table"
        data-pagination="true"
        data-side-pagination="server"
        data-page-size="25"
        data-page-list="[25, 50, 100, 1000, all]"
        data-sort-name="log_time"
        data-sort-order="desc"
        data-url="{{ url_for('jobs.get_job_logs', job_id=job_id) }}">
        <thead>
            <tr>
                <th data-field="log_time" data-sortable="true">Time</th>
                <th data-field="log_level" data-sortable="true" data-width="80">Level</th>
                <th data-field="log_message" data-sortable="true">Message</th>
            </tr>
        </thead>
    </table>
{% endblock %}
