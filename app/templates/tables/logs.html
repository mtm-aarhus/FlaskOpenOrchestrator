{% extends "base.html" %}

{% block content %}
    <h1 class="text-center mb-3">Logs</h1>

    <div id="logs-toolbar" class="d-flex align-items-end mb-2 w-100">
        <a href="{{ url_for('logs.view_all_logs') }}"
        class="btn btn-primary btn-sm">
            Alle logs
        </a>

        <div class="ms-auto">
            <label for="logs-overview-search" class="form-label mb-1">Search</label>
            <input
                id="logs-overview-search"
                type="text"
                class="form-control form-control-sm"
                placeholder="Search process…"
            >
        </div>
    </div>

  <table id="logs-overview-table" class="table table-striped table-hover"
    data-toggle="table"
    data-pagination="true"
    data-page-size="25"
    data-page-list="[25, 50, 100, 1000, all]"
    data-toolbar="#logs-toolbar"
    data-sort-name="process_name"
    data-sort-order="asc"
    data-search="false">

    <thead>
      <tr>
        <th data-field="process_name" data-type="string" data-sortable="true">Process Name</th>
        <th data-type="number" data-sortable="true" class="d-none d-md-table-cell">Trace</th>
        <th data-type="number" data-sortable="true" class="d-none d-md-table-cell">Info</th>
        <th data-type="number" data-sortable="true">Error</th>
        <th data-type="number" data-sortable="true" class="d-none d-sm-table-cell">Total</th>
        <th data-width="100">View</th>
      </tr>
    </thead>

    <tbody>
      {% for process, counts in log_counts.items() %}
      <tr>
        <td>{{ process }}</td>
        <td class="d-none d-md-table-cell">{{ counts["TRACE"] }}</td>
        <td class="d-none d-md-table-cell">{{ counts["INFO"] }}</td>
        <td class="text-danger fw-bold">{{ counts["ERROR"] }}</td>
        <td class="fw-bold d-none d-sm-table-cell">{{ counts["Total"] }}</td>
        <td>
          <a href="{{ url_for('logs.view_logs', process_name=process) }}" class="btn btn-primary btn-sm">
            View Logs
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("logs-overview-search");
      input.addEventListener("input", () => {
        $("#logs-overview-table").bootstrapTable("resetSearch", input.value);
      });
    });
  </script>
{% endblock %}
