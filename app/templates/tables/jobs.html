{% extends "base.html" %}

{% block content %}
    <h1 class="text-center">Jobs</h1>

    <div id="jobs-toolbar" class="d-flex flex-wrap align-items-center justify-content-between mb-2 w-100">
        <div class="d-flex gap-2 flex-wrap flex-grow-1">
            <div class="d-flex flex-column">
                <label for="job-status-filter" class="form-label">Status</label>
                <select id="job-status-filter" class="form-select w-auto" onchange="updateJobTableFilters()">
                    <option value="">All</option>
                </select>
            </div>
            <div class="d-flex flex-column">
                <label for="date-filter-start" class="form-label">From</label>
                <input type="datetime-local" id="date-filter-start" class="form-control w-auto" onchange="updateJobTableFilters()">
            </div>
            <div class="d-flex flex-column">
                <label for="date-filter-end" class="form-label">To</label>
                <input type="datetime-local" id="date-filter-end" class="form-control w-auto" onchange="updateJobTableFilters()">
            </div>
            <div class="d-flex flex-column">
                <label for="job-search" class="form-label">Search</label>
                <input type="text" id="job-search" class="form-control w-auto" placeholder="process / scheduler" oninput="updateJobTableFilters()">
            </div>
        </div>
    </div>

    <table id="jobs-table"
        class="table table-striped table-hover"
        data-toggle="table"
        data-pagination="true"
        data-side-pagination="server"
        data-page-size="25"
        data-page-list="[25, 50, 100, 1000, all]"
        data-unique-id="id"
        data-toolbar="#jobs-toolbar"
        data-sort-name="start_time"
        data-sort-order="desc"
        data-url="{{ url_for('jobs.get_jobs_data') }}">
        <thead>
            <tr>
                <th data-field="status" data-sortable="true" data-formatter="formatJobStatus" data-width="110">Status</th>
                <th data-field="process_name" data-sortable="true">Process</th>
                <th data-field="scheduler_name" data-sortable="true" class="d-none d-md-table-cell" data-class="d-none d-md-table-cell">Scheduler</th>
                <th data-field="start_time" data-sortable="true">Start</th>
                <th data-field="end_time" data-sortable="true" class="d-none d-lg-table-cell" data-class="d-none d-lg-table-cell">End</th>
                <th data-field="duration" data-formatter="formatJobDuration" class="d-none d-md-table-cell" data-class="d-none d-md-table-cell">Duration</th>
                <th data-field="id" data-formatter="formatJobActions" data-width="220">Actions</th>
            </tr>
        </thead>
    </table>
{% endblock %}
